constr:
  '$MList':
    label: 'MList'
    args:
      0:
        inTable: true
  '$MQueue':
    label: 'MQueue'
    args:
      0:
        inTable: true
  '$MCell':
    label: 'MCell'
    drawBorder: true
  '$MListSeg':
    label: 'MListSeg'
    inPort: 'portL'
    args:
      0:
        forceEdge: true # forceEdge=true means there is always an edge to this argument
        outPort: 'portL'
      1:
        inTable: true
        inPort: 'portL'
  '$MTree':
    label: 'MTree'
    args:
      0:
        inTable: true
  '$MNode':
    label: 'MNode'
    drawBorder: true
